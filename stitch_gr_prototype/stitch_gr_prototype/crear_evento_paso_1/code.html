<body class="bg-app-bg text-on-surface antialiased min-h-screen font-body-md text-body-md flex flex-col items-center justify-center py-stack-lg px-margin-page">
<!-- Top App Bar - Linear flow, so back button only, no nav cluster -->
<div class="fixed top-0 left-0 w-full h-[64px] bg-app-bg flex items-center justify-between px-margin-page z-10">
<button aria-label="Volver" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-primary rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="text-headline-h3 font-headline-h3 text-primary">Crear Evento</div>
<div class="w-touch-target-min"></div> <!-- Spacer for centering -->
</div>
<!-- Main Content Container - Wizard Card -->
<main class="w-full max-w-lg mt-16 bg-surface rounded-xl border border-border overflow-hidden">
<!-- Progress Indicator -->
<div class="px-gutter-card py-stack-md border-b border-border bg-surface-bright flex flex-col gap-stack-sm">
<div class="flex justify-between items-center text-caption-sm font-caption-sm text-text-secondary">
<span>Paso 1 de 5</span>
<span>Información Básica</span>
</div>
<div class="w-full h-1 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-secondary-fixed-dim w-1/5 rounded-full transition-all duration-300"></div>
</div>
</div>
<!-- Form Area -->
<div class="p-gutter-card flex flex-col gap-stack-lg">
<div class="flex flex-col gap-stack-sm">
<h1 class="text-headline-h2 font-headline-h2 text-primary">Detalles del Evento</h1>
<p class="text-text-secondary text-body-md font-body-md">Ingresa la información fundamental para dar inicio a la planificación.</p>
</div>
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Nombre del Evento -->
<div class="flex flex-col gap-base">
<label class="text-label-btn font-label-btn text-primary" for="event-name">Nombre del evento</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary text-[20px]" data-icon="celebration">celebration</span>
</div>
<input class="w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder-text-secondary" id="event-name" placeholder="Ej. Graduación Gen 2024" type="text"/>
</div>
</div>
<!-- Fecha -->
<div class="flex flex-col gap-base">
<label class="text-label-btn font-label-btn text-primary" for="event-date">Fecha estimada</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary text-[20px]" data-icon="calendar_today">calendar_today</span>
</div>
<input class="w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="event-date" type="date"/>
</div>
</div>
<!-- Lugar -->
<div class="flex flex-col gap-base">
<label class="text-label-btn font-label-btn text-primary" for="event-location">Lugar o Ciudad</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary text-[20px]" data-icon="location_on">location_on</span>
</div>
<input class="w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder-text-secondary" id="event-location" placeholder="Ej. Salón principal, Ciudad" type="text"/>
</div>
</div>
<!-- Capacidad -->
<div class="flex flex-col gap-base">
<label class="text-label-btn font-label-btn text-primary" for="event-capacity">Capacidad (invitados)</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary text-[20px]" data-icon="group">group</span>
</div>
<input class="w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder-text-secondary" id="event-capacity" placeholder="Ej. 500" type="number"/>
</div>
</div>
</form>
</div>
<!-- Action Footer -->
<div class="p-gutter-card border-t border-border bg-surface-bright mt-4">
<button class="w-full h-button-height bg-primary text-on-primary rounded-lg text-label-btn font-label-btn hover:bg-primary/90 transition-colors flex items-center justify-center gap-2">
                Continuar
                <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>

</body></html>
