<body class="bg-app-bg text-on-surface font-body-md min-h-screen">
<!-- Top Navigation Blocked on Desktop Settings as it's a sub-page/overlay, however, we use a standalone card layout for this "Editar Mesa" intent to respect the "Destination Rule" filter. -->
<main class="w-full min-h-screen flex items-center justify-center p-margin-page bg-app-bg">
<!-- Main Form Card (Level 1 Elevation) -->
<div class="bg-surface border border-border rounded-xl w-full max-w-[600px] shadow-sm relative overflow-hidden">
<!-- Header Section -->
<div class="p-stack-lg border-b border-border flex items-center justify-between">
<div>
<h2 class="text-headline-h2 font-headline-h2 text-primary">Editar Mesa 24</h2>
<p class="text-text-secondary text-body-md font-body-md mt-base">Modifica los detalles de asignación</p>
</div>
<button aria-label="Cerrar" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-text-secondary hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Form Content -->
<form class="p-stack-lg flex flex-col gap-stack-lg">
<!-- Input Group: Nombre/Número -->
<div class="flex flex-col gap-stack-sm">
<label class="text-label-btn font-label-btn text-on-surface" for="mesa_nombre">Nombre / número</label>
<input class="w-full h-button-height px-4 border border-border rounded-lg bg-surface text-body-md font-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="mesa_nombre" placeholder="Ej. Mesa 24" type="text" value="Mesa 24"/>
</div>
<!-- Input Group: Capacidad -->
<div class="flex flex-col gap-stack-sm">
<label class="text-label-btn font-label-btn text-on-surface" for="mesa_capacidad">Capacidad</label>
<div class="relative">
<input class="w-full h-button-height pl-12 pr-4 border border-border rounded-lg bg-surface text-body-md font-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="mesa_capacidad" placeholder="0" type="number" value="10"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary" data-icon="group">group</span>
</div>
<p class="text-caption-sm font-caption-sm text-text-secondary">Número máximo de asientos disponibles para esta mesa.</p>
</div>
<hr class="border-border my-stack-sm"/>
<!-- Danger Zone / Action -->
<div class="bg-error-light rounded-lg p-stack-md border border-[#FFCDD2] flex flex-col sm:flex-row items-start sm:items-center justify-between gap-stack-md">
<div class="flex items-start gap-stack-sm">
<span class="material-symbols-outlined text-error mt-0.5" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<div>
<h3 class="text-label-btn font-label-btn text-error">Bloquear mesa</h3>
<p class="text-caption-sm font-caption-sm text-[#B71C1C] mt-base">Los graduados no podrán seleccionar esta mesa mientras permanezca bloqueada.</p>
</div>
</div>
<!-- Switch / Toggle representation -->
<label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-border peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-error"></div>
</label>
</div>
</form>
<!-- Footer Actions -->
<div class="p-stack-lg border-t border-border bg-surface-bright flex flex-col sm:flex-row justify-end gap-gutter-card">
<button class="h-button-height px-6 rounded-lg border border-primary text-primary text-label-btn font-label-btn bg-surface hover:bg-surface-container transition-colors flex items-center justify-center min-w-[120px]" type="button">
                    Cancelar
                </button>
<button class="h-button-height px-6 rounded-lg bg-primary text-on-primary text-label-btn font-label-btn hover:opacity-90 transition-opacity flex items-center justify-center min-w-[160px]" type="button">
                    Guardar cambios
                </button>
</div>
</div>
