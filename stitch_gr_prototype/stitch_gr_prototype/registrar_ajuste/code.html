<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Registrar ajuste</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "error-light": "#FFEBEE",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#29313d",
                        "secondary": "#735c00",
                        "primary-container": "#1a2b4c",
                        "background": "#f8f9ff",
                        "secondary-fixed-dim": "#e9c349",
                        "inverse-on-surface": "#ebf1ff",
                        "surface-container": "#e6eeff",
                        "warning-light": "#FFF8E1",
                        "primary-fixed-dim": "#b6c6f0",
                        "on-secondary-fixed": "#241a00",
                        "tertiary-fixed": "#baeed9",
                        "on-primary-fixed-variant": "#364669",
                        "success-light": "#E8F5E9",
                        "on-primary-container": "#8293ba",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#b6c6f0",
                        "on-primary-fixed": "#071b3b",
                        "on-surface-variant": "#44474e",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e1e8f9",
                        "surface": "#FFFFFF",
                        "app-bg": "#F8F9FA",
                        "border": "#D0D5DD",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#574500",
                        "secondary-container": "#fed65b",
                        "on-secondary-container": "#745c00",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#9ed1bd",
                        "tertiary-container": "#003326",
                        "secondary-fixed": "#ffe088",
                        "outline-variant": "#c5c6cf",
                        "outline": "#75777f",
                        "on-background": "#141c28",
                        "primary": "#031636",
                        "surface-container-highest": "#dbe3f3",
                        "on-surface": "#141c28",
                        "on-tertiary-fixed-variant": "#1d4f40",
                        "surface-container-low": "#eff3ff",
                        "on-tertiary-fixed": "#002117",
                        "surface-tint": "#4e5e82",
                        "error": "#9A2A2A",
                        "warning": "#B76E00",
                        "surface-bright": "#f8f9ff",
                        "text-secondary": "#667085",
                        "on-tertiary-container": "#6c9d8b",
                        "surface-dim": "#d2daeb",
                        "surface-variant": "#dbe3f3",
                        "primary-fixed": "#d8e2ff",
                        "tertiary": "#001c14"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "touch-target-min": "44px",
                        "gutter-card": "16px",
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "base": "4px",
                        "button-height": "48px",
                        "margin-page": "20px"
                    },
                    "fontFamily": {
                        "headline-h1": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-h2": ["Inter"],
                        "caption-sm": ["Inter"],
                        "label-btn": ["Inter"],
                        "headline-h3": ["Inter"],
                        "display-hero": ["Inter"]
                    },
                    "fontSize": {
                        "headline-h1": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-h2": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "caption-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "label-btn": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-h3": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "display-hero": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-app-bg text-on-surface font-body-md min-h-screen flex items-center justify-center p-4">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-primary/40 backdrop-blur-sm z-40 flex items-center justify-center p-4">
<!-- Modal Container Level 2 (Modals/Overlays) -->
<div class="bg-surface rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] w-full max-w-lg overflow-hidden flex flex-col z-50">
<!-- Modal Header -->
<div class="flex items-center justify-between px-6 py-4 border-b border-border">
<h2 class="text-headline-h2 font-headline-h2 text-on-surface">Registrar ajuste</h2>
<button aria-label="Cerrar modal" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-text-secondary hover:text-on-surface transition-colors rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="px-6 py-6 flex flex-col gap-stack-lg">
<!-- Type Selector -->
<div class="flex flex-col gap-stack-sm">
<label class="text-label-btn font-label-btn text-on-surface">Tipo de movimiento</label>
<div class="flex gap-4">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="w-5 h-5 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
</div>
<span class="text-body-md font-body-md text-on-surface group-hover:text-primary transition-colors">Ajuste</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<div class="w-5 h-5 rounded-full border-2 border-border group-hover:border-primary transition-colors flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
<span class="text-body-md font-body-md text-text-secondary group-hover:text-primary transition-colors">Reembolso</span>
</label>
</div>
</div>
<!-- Input Grid -->
<div class="grid grid-cols-2 gap-gutter-card">
<div class="flex flex-col gap-stack-sm">
<label class="text-label-btn font-label-btn text-on-surface" for="amount">Monto</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary text-body-md font-body-md">$</span>
<input class="w-full h-11 pl-8 pr-3 border border-border rounded-lg bg-surface text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="amount" placeholder="0.00" type="number"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="text-label-btn font-label-btn text-on-surface" for="date">Fecha</label>
<div class="relative">
<input class="w-full h-11 px-3 border border-border rounded-lg bg-surface text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="date" type="date"/>
</div>
</div>
</div>
<!-- Reason Textarea -->
<div class="flex flex-col gap-stack-sm">
<label class="text-label-btn font-label-btn text-on-surface" for="reason">Motivo</label>
<textarea class="w-full p-3 border border-border rounded-lg bg-surface text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-none" id="reason" placeholder="Describe el motivo del ajuste o reembolso..." rows="3"></textarea>
</div>
<!-- Mandatory Text Warning -->
<div class="flex items-start gap-3 p-4 bg-surface-container-low rounded-lg border border-surface-container-highest">
<span class="material-symbols-outlined text-primary mt-0.5" data-icon="info">info</span>
<p class="text-body-md font-body-md text-text-secondary">
                        El pago original permanecerá en el historial.
                    </p>
</div>
</div>
<!-- Modal Footer -->
<div class="px-6 py-4 bg-surface-bright border-t border-border flex items-center justify-end gap-4">
<button class="h-button-height px-6 rounded-lg bg-surface border border-primary text-primary text-label-btn font-label-btn hover:bg-surface-container-low transition-colors min-w-[120px]">
                    Cancelar
                </button>
<button class="h-button-height px-6 rounded-lg bg-primary text-on-primary text-label-btn font-label-btn hover:bg-on-primary-fixed transition-colors min-w-[180px]">
                    Registrar movimiento
                </button>
</div>
</div>
</div>
</body></html>
