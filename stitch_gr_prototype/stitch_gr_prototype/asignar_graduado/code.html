        body { font-family: 'Inter', sans-serif; }
    </style>

<body class="bg-app-bg text-on-surface h-screen flex flex-col antialiased">
<!-- Suppressing Nav Bars as this is a Modal context per instructions -->
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-primary/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
<!-- Modal Content -->
<div class="bg-surface rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] w-full max-w-lg overflow-hidden flex flex-col relative border border-border">
<!-- Header -->
<div class="px-6 py-5 border-b border-border flex justify-between items-center bg-surface-container-lowest">
<div>
<h2 class="font-headline-h2 text-headline-h2 text-on-surface">Asignar graduado</h2>
<p class="font-body-md text-body-md text-text-secondary mt-1">Mesa 24 • Capacidad: 10 lugares</p>
</div>
<button class="w-[44px] h-[44px] flex items-center justify-center rounded-full hover:bg-surface-container transition-colors text-text-secondary">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body -->
<div class="p-6 flex-1 overflow-y-auto">
<!-- Search Field -->
<div class="mb-6">
<label class="block font-label-btn text-label-btn text-on-surface mb-2" for="search-graduado">Buscar graduado</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary">search</span>
<input class="w-full pl-10 pr-4 h-[48px] border border-border rounded-lg bg-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all" id="search-graduado" type="text" value="Andrea Martínez"/>
</div>
</div>
<!-- Search Results -->
<div class="space-y-3">
<div class="p-4 border border-primary rounded-lg bg-surface-container-low flex items-center justify-between cursor-pointer hover:bg-surface-container transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-headline-h3 text-headline-h3">
                                AM
                            </div>
<div>
<h3 class="font-headline-h3 text-headline-h3 text-on-surface">Andrea Martínez</h3>
<p class="font-caption-sm text-caption-sm text-text-secondary flex items-center gap-1 mt-0.5">
<span class="material-symbols-outlined text-[16px]">group</span>
                                    8 lugares requeridos
                                </p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center bg-primary text-on-primary">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</div>
<!-- Capacity Alert (Success) -->
<div class="mt-6 p-4 rounded-lg bg-success-light border border-[#C8E6C9] flex items-start gap-3">
<span class="material-symbols-outlined text-[#2E7D32] mt-0.5" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div>
<h4 class="font-label-btn text-label-btn text-[#1B5E20]">Capacidad suficiente</h4>
<p class="font-caption-sm text-caption-sm text-[#2E7D32] mt-1">La Mesa 24 tiene 10 lugares disponibles. Tras asignar a Andrea Martínez, quedarán 2 lugares libres.</p>
</div>
</div>
</div>
<!-- Footer / Actions -->
<div class="px-6 py-5 border-t border-border bg-surface-container-lowest flex justify-end gap-3">
<button class="h-[48px] px-6 font-label-btn text-label-btn text-primary border border-primary rounded-lg hover:bg-surface-container transition-colors min-w-[44px]">
                    Cancelar
                </button>
<button class="h-[48px] px-6 font-label-btn text-label-btn text-on-primary bg-primary rounded-lg hover:bg-primary-container transition-colors min-w-[44px] shadow-sm">
                    Asignar a Mesa 24
                </button>
</div>
</div>
</div>
