<body class="bg-app-bg text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 border-b border-border bg-surface dark:bg-background">
<div class="flex justify-between items-center h-button-height px-margin-page w-full max-w-7xl mx-auto">
<button class="material-symbols-outlined text-primary dark:text-primary-fixed active:scale-95 duration-150 w-touch-target-min h-touch-target-min flex items-center justify-start hover:bg-surface-container-low transition-colors" data-icon="arrow_back">arrow_back</button>
<h1 class="font-headline-h3 text-headline-h3 text-primary dark:text-primary-fixed truncate px-2">Graduación Facultad de Derecho 2027</h1>
<button class="material-symbols-outlined text-primary dark:text-primary-fixed active:scale-95 duration-150 w-touch-target-min h-touch-target-min flex items-center justify-end hover:bg-surface-container-low transition-colors" data-icon="account_circle">account_circle</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[80px] pb-[100px] px-margin-page w-full max-w-lg mx-auto">
<!-- Payment Details Card -->
<article class="bg-surface rounded-lg border border-border p-stack-lg shadow-sm">
<header class="flex justify-between items-start mb-stack-md">
<h2 class="font-headline-h2 text-headline-h2 text-on-surface">Mensualidad 4</h2>
<div class="bg-warning-light text-warning font-caption-sm text-caption-sm px-2 py-1 rounded-full flex items-center gap-1 border border-warning/20">
<span class="material-symbols-outlined text-[14px]" data-icon="schedule" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span>Próximo</span>
</div>
</header>
<div class="mt-base">
<p class="font-caption-sm text-caption-sm text-text-secondary uppercase tracking-widest mb-1">Monto a pagar</p>
<p class="font-display-hero text-display-hero text-primary">$2,500 MXN</p>
</div>
<div class="border-t border-border mt-stack-lg pt-stack-md flex items-center gap-stack-sm">
<span class="material-symbols-outlined text-text-secondary" data-icon="calendar_month">calendar_month</span>
<div>
<p class="font-caption-sm text-caption-sm text-text-secondary">Vencimiento</p>
<p class="font-body-md text-body-md text-on-surface font-medium">15 de marzo de 2027</p>
</div>
</div>
</article>
<!-- Informational Callout -->
<aside class="bg-surface-bright rounded-lg border border-surface-dim p-stack-md mt-stack-md flex items-start gap-stack-sm">
<span class="material-symbols-outlined text-primary mt-0.5" data-icon="info">info</span>
<p class="font-body-md text-body-md text-text-secondary">
                Puedes pagar esta mensualidad o adelantar pagos futuros.
            </p>
</aside>
<!-- Primary Action -->
<div class="mt-stack-lg">
<button class="w-full h-button-height bg-primary text-on-primary font-label-btn text-label-btn rounded-DEFAULT flex items-center justify-center transition-transform active:scale-95 duration-150 shadow-sm hover:bg-primary-container">
<span class="material-symbols-outlined mr-2 text-[20px]" data-icon="lock">lock</span>
                Pagar ahora
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 h-16 border-t border-border bg-surface dark:bg-background pb-safe">
<div class="flex justify-around items-center w-full px-margin-page h-full max-w-lg mx-auto">
<!-- Inicio (Inactive) -->
<button class="flex flex-col items-center justify-center text-text-secondary dark:text-on-surface-variant hover:bg-surface-container-lowest transition-all active:scale-90 duration-200 w-full h-full">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="home">home</span>
<span class="font-caption-sm text-caption-sm">Inicio</span>
</button>
<!-- Mi grupo (Inactive) -->
<button class="flex flex-col items-center justify-center text-text-secondary dark:text-on-surface-variant hover:bg-surface-container-lowest transition-all active:scale-90 duration-200 w-full h-full">

<span class="font-caption-sm text-caption-sm">Pagos</span>
</button>

<button class="flex flex-col items-center justify-center text-text-secondary dark:text-on-surface-variant hover:bg-surface-container-lowest transition-all active:scale-90 duration-200 w-full h-full">
<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="menu">menu</span>
