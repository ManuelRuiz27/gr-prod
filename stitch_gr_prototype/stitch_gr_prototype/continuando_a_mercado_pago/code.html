<style>
        .loader-ring {
            display: inline-block;
            position: relative;
            width: 80px;
            height: 80px;
        }
        .loader-ring div {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 64px;
            height: 64px;
            margin: 8px;
            border: 4px solid;
            border-radius: 50%;
            animation: loader-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-color: #031636 transparent transparent transparent; /* primary color */
        }
        .loader-ring div:nth-child(1) {
            animation-delay: -0.45s;
        }
        .loader-ring div:nth-child(2) {
            animation-delay: -0.3s;
        }
        .loader-ring div:nth-child(3) {
            animation-delay: -0.15s;
        }
        @keyframes loader-ring {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<style>

<body class="bg-app-bg text-on-surface min-h-screen flex flex-col items-center justify-center font-body-md antialiased p-margin-page overflow-hidden">
<!-- Note: TopAppBar and BottomNavBar are suppressed as this is a linear/transactional transition screen -->

<!-- Premium Shield/Lock Icon context -->
<div class="mb-stack-lg h-24 w-24 bg-surface rounded-full shadow-[0_8px_24px_rgba(3,22,54,0.08)] flex items-center justify-center border border-border/50">

</div>
<h1 class="font-headline-h1 text-headline-h1 text-primary mb-stack-sm px-4">
            Continuando a Mercado Pago…

<p class="font-body-md text-body-md text-text-secondary mb-stack-lg max-w-[280px]">

        </p>
<!-- Custom Spinner styled with primary color -->
<div aria-label="Cargando" class="loader-ring mb-stack-lg">
<div></div>
<div></div>
<div></div>
<div></div>
</div>
<p class="font-caption-sm text-caption-sm text-text-secondary/70 flex items-center justify-center gap-2 mt-stack-md">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">security</span>
            Conexión segura encriptada
        </p>
</main>
<!-- Simulated auto-redirect visual cue (optional micro-interaction) -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-surface-variant">
<div class="h-full bg-primary transition-all duration-[3000ms] ease-linear w-0" id="progress-bar"></div>
</div>
<script>
        // Simple script to animate the progress bar simulating redirect
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const progressBar = document.getElementById('progress-bar');
                if(progressBar) {
                    progressBar.style.width = '100%';
                }
            }, 100);
        });
    </script>
