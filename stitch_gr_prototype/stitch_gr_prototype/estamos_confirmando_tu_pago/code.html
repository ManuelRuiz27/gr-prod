<style>
        /* Custom animations for premium processing state */
        @keyframes subtle-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-subtle-spin {
            animation: subtle-spin 3s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
        }
        
        @keyframes gentle-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.96); }
        }
        .animate-gentle-pulse {
            animation: gentle-pulse 2.5s ease-in-out infinite;
        }

        @keyframes shimmer-line {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .animate-shimmer {
            position: relative;
            overflow: hidden;
        }
        .animate-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,0.6) 20%, rgba(255,255,255,0.6) 60%, rgba(255,255,255,0) 100%);
