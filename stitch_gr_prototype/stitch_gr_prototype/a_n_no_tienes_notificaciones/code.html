<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .animate-pulse-ring::before {
            content: '';
            position: absolute;
            left: 0; top: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background-color: theme('colors.primary-fixed-dim');
            animation: pulse-ring 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }
    </style>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-app-bg text-on-surface antialiased min-h-screen flex flex-col font-body-md">
<!-- Top App Bar -->
<header class="bg-surface border-b border-border fixed top-0 w-full z-50 flex justify-between items-center h-button-height px-margin-page max-w-7xl mx-auto">
<button aria-label="Volver" class="flex items-center justify-center min-w-touch-target-min min-h-touch-target-min active:scale-95 duration-150 text-primary hover:bg-surface-container-low transition-colors rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-h3 text-headline-h3 text-primary text-center flex-grow truncate px-4">
            Graduación Facultad de Derecho 2027
        </h1>
<button aria-label="Perfil" class="flex items-center justify-center min-w-touch-target-min min-h-touch-target-min active:scale-95 duration-150 text-primary hover:bg-surface-container-low transition-colors rounded-full">
<span class="material-symbols-outlined" data-icon="account_circle" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</header>
<!-- Main Content Area - Empty State -->
<main class="flex-grow pt-[calc(theme('spacing.button-height')+theme('spacing.margin-page'))] pb-[calc(64px+theme('spacing.margin-page'))] px-margin-page max-w-md mx-auto w-full flex flex-col justify-center items-center h-[884px]">
<div class="glass-panel w-full p-8 rounded-xl shadow-sm border border-border flex flex-col items-center justify-center text-center relative overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-secondary-fixed-dim/20 rounded-full blur-2xl"></div>
<div class="absolute -bottom-12 -left-12 w-32 h-32 bg-primary-fixed-dim/20 rounded-full blur-2xl"></div>
<!-- Empty State Illustration/Icon -->
<div class="relative w-24 h-24 mb-stack-lg flex items-center justify-center animate-float">
<div class="absolute inset-0 bg-surface-container-high rounded-full animate-pulse-ring"></div>
<div class="relative z-10 w-16 h-16 bg-surface rounded-full flex items-center justify-center shadow-sm border border-border">
<span class="material-symbols-outlined text-4xl text-text-secondary" data-icon="notifications_off" style="font-variation-settings: 'FILL' 0;">notifications_off</span>
</div>
</div>
<!-- Empty State Text -->
<h2 class="font-headline-h2 text-headline-h2 text-primary mb-stack-sm">
                Aún no tienes notificaciones
            </h2>
<p class="font-body-md text-body-md text-text-secondary max-w-[280px]">
                Te avisaremos aquí sobre actualizaciones importantes, pagos próximos y novedades de tu evento.
            </p>
<div class="mt-stack-lg">
<button class="h-button-height px-6 bg-surface border border-border text-primary font-label-btn text-label-btn rounded-DEFAULT hover:bg-surface-container-low active:scale-95 transition-all shadow-sm">
                    Actualizar
                </button>
</div>
</div>
</main>

<span class="font-caption-sm text-caption-sm">Pagos</span>
</a>
<!-- Active Tab - Assuming "Más" or similar is active for notifications, though notifications isn't explicitly in the nav, we'll leave them inactive or highlight "Inicio" as fallback if this is a sub-page. As a sub-page, we should arguably suppress nav, but instructions say bottom nav has 4 slots. We will highlight "Inicio" as default if no direct match, but notifications usually lives under "Más". Let's highlight "Más". -->
<a class="flex flex-col items-center justify-center text-primary font-semibold hover:bg-surface-container-lowest transition-all active:scale-90 duration-200 min-w-touch-target-min min-h-touch-target-min flex-1" href="#">
<span class="material-symbols-outlined mb-1 text-primary" data-icon="menu" style="font-variation-settings: 'FILL' 1;">menu</span>
<span class="font-caption-sm text-caption-sm text-primary">Más</span>
</a>
</nav>
