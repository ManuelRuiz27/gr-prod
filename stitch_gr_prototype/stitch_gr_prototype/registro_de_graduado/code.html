<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Registro de Graduado - Facultad de Derecho 2027</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#9A2A2A",
                        "tertiary-fixed": "#baeed9",
                        "surface-dim": "#d2daeb",
                        "primary-fixed-dim": "#b6c6f0",
                        "on-primary-fixed": "#071b3b",
                        "outline": "#75777f",
                        "surface-container-highest": "#dbe3f3",
                        "surface-tint": "#4e5e82",
                        "inverse-surface": "#29313d",
                        "on-tertiary-container": "#6c9d8b",
                        "success-light": "#E8F5E9",
                        "primary": "#031636",
                        "inverse-on-surface": "#ebf1ff",
                        "primary-fixed": "#d8e2ff",
                        "on-error-container": "#93000a",
                        "app-bg": "#F8F9FA",
                        "secondary": "#735c00",
                        "warning": "#B76E00",
                        "tertiary-fixed-dim": "#9ed1bd",
                        "outline-variant": "#c5c6cf",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "surface-container": "#e6eeff",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#fed65b",
                        "on-surface-variant": "#44474e",
                        "background": "#f8f9ff",
                        "tertiary": "#001c14",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#b6c6f0",
                        "on-primary-fixed-variant": "#364669",
                        "surface-variant": "#dbe3f3",
                        "on-surface": "#141c28",
                        "primary-container": "#1a2b4c",
                        "on-background": "#141c28",
                        "secondary-fixed-dim": "#e9c349",
                        "on-tertiary-fixed": "#002117",
                        "on-tertiary-fixed-variant": "#1d4f40",
                        "on-primary-container": "#8293ba",
                        "on-secondary-fixed-variant": "#574500",
                        "on-secondary-container": "#745c00",
                        "surface-container-lowest": "#ffffff",
                        "text-secondary": "#667085",
                        "border": "#D0D5DD",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container-high": "#e1e8f9",
                        "error-light": "#FFEBEE",
                        "on-secondary-fixed": "#241a00",
                        "surface-container-low": "#eff3ff",
                        "secondary-fixed": "#ffe088",
                        "surface": "#FFFFFF",
                        "tertiary-container": "#003326",
                        "warning-light": "#FFF8E1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "margin-page": "20px",
                        "stack-sm": "8px",
                        "gutter-card": "16px",
                        "button-height": "48px",
                        "stack-lg": "24px",
                        "touch-target-min": "44px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "headline-h3": ["Inter"],
                        "headline-h2": ["Inter"],
                        "caption-sm": ["Inter"],
                        "display-hero": ["Inter"],
                        "headline-h1": ["Inter"],
                        "label-btn": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-h3": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-h2": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "caption-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "display-hero": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-h1": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-btn": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Premium Sober Input Styling */
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            transition: all 0.2s ease-in-out;
            background-color: transparent;
        }
        
        input:focus {
            box-shadow: 0 0 0 1px #031636 !important; /* primary color */
            border-color: #031636 !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-app-bg text-on-background font-body-md antialiased min-h-screen flex flex-col items-center">
<!-- Main Content Container - Fixed-Fluid Hybrid max width 390px for intended experience, centered on larger screens -->
<main class="w-full max-w-[390px] min-h-screen bg-app-bg relative flex flex-col shadow-[0_0_40px_rgba(0,0,0,0.05)] mx-auto overflow-hidden">
<!-- Top App Bar (Transactional variant - only back button, no trailing icon, no bottom border) -->
<header class="fixed top-0 w-full max-w-[390px] z-50 bg-app-bg">
<div class="flex items-center h-[56px] px-margin-page">
<button aria-label="Volver" class="w-touch-target-min h-touch-target-min flex items-center justify-start text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px]" data-icon="arrow_back">arrow_back</span>
</button>
</div>
</header>
<!-- Spacer for fixed header -->
<div class="h-[56px]"></div>
<!-- Registration Form Content -->
<section class="flex-grow flex flex-col px-margin-page pb-stack-lg pt-stack-md">
<!-- Header Text -->
<div class="mb-stack-lg">
<h1 class="font-display-hero text-display-hero text-primary mb-stack-sm">Registro de graduado</h1>
<p class="font-body-md text-body-md text-text-secondary">
                    Graduación Facultad de Derecho 2027
                </p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md flex-grow">
<!-- Bento-style Form Container (Level 1 Surface) -->
<div class="bg-surface rounded-xl border border-border p-gutter-card flex flex-col gap-stack-md">
<!-- Personal Info Section -->
<div class="flex flex-col gap-stack-sm">
<div class="relative">
<label class="sr-only" for="nombre">Nombre completo</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary text-[20px]" data-icon="person">person</span>
</div>
<input class="w-full pl-10 pr-3 py-3 border-border rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant bg-transparent h-[48px]" id="nombre" name="nombre" placeholder="Nombre completo" required="" type="text"/>
</div>
<div class="relative">
<label class="sr-only" for="email">Correo electrónico</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full pl-10 pr-3 py-3 border-border rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant bg-transparent h-[48px]" id="email" name="email" placeholder="Correo electrónico" required="" type="email"/>
</div>
<div class="relative">
<label class="sr-only" for="telefono">Teléfono</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary text-[20px]" data-icon="phone">phone</span>
</div>
<input class="w-full pl-10 pr-3 py-3 border-border rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant bg-transparent h-[48px]" id="telefono" name="telefono" placeholder="Teléfono" required="" type="tel"/>
</div>
</div>
<!-- Academic Info Section - Visual separation via subtle divider -->
<hr class="border-t border-surface-variant my-1"/>
<div class="flex flex-col gap-stack-sm">
<div class="relative">
<label class="sr-only" for="carrera">Carrera</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary text-[20px]" data-icon="school">school</span>
</div>
<input class="w-full pl-10 pr-3 py-3 border-border rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant bg-transparent h-[48px]" id="carrera" name="carrera" placeholder="Carrera" required="" type="text"/>
</div>
<div class="relative">
<label class="sr-only" for="generacion">Generación</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary text-[20px]" data-icon="calendar_today">calendar_today</span>
</div>
<input class="w-full pl-10 pr-3 py-3 border-border rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant bg-transparent h-[48px]" id="generacion" name="generacion" placeholder="Generación" readonly="" type="text" value="2023 - 2027"/>
</div>
</div>
<!-- Security Section -->
<hr class="border-t border-surface-variant my-1"/>
<div class="flex flex-col gap-stack-sm">
<div class="relative">
<label class="sr-only" for="password">Contraseña</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-3 border-border rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant bg-transparent h-[48px]" id="password" name="password" placeholder="Contraseña" required="" type="password"/>
<button aria-label="Mostrar contraseña" class="absolute inset-y-0 right-0 pr-3 flex items-center text-text-secondary w-touch-target-min h-[48px] justify-end" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<div class="relative">
<label class="sr-only" for="confirm_password">Confirmar contraseña</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-secondary text-[20px]" data-icon="lock_reset">lock_reset</span>
</div>
<input class="w-full pl-10 pr-10 py-3 border-border rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant bg-transparent h-[48px]" id="confirm_password" name="confirm_password" placeholder="Confirmar contraseña" required="" type="password"/>
<button aria-label="Mostrar contraseña" class="absolute inset-y-0 right-0 pr-3 flex items-center text-text-secondary w-touch-target-min h-[48px] justify-end" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Footer Text & CTA Container (Pushed to bottom) -->
<div class="mt-auto pt-stack-lg flex flex-col gap-stack-md">
<div class="flex items-start gap-2 bg-surface-container-low p-3 rounded-lg border border-surface-variant">
<span class="material-symbols-outlined text-primary text-[16px] mt-[2px]" data-icon="info">info</span>
<p class="font-caption-sm text-caption-sm text-text-secondary">
                            Tu cuenta quedará vinculada a esta graduación.
                        </p>
</div>
<button class="w-full h-button-height bg-primary text-on-primary font-label-btn text-label-btn rounded-lg flex items-center justify-center active:scale-[0.98] transition-transform shadow-[0_4px_12px_rgba(3,22,54,0.15)]" type="submit">
                        Crear mi cuenta
                    </button>
</div>
</form>
</section>
<!-- Bottom Safe Area Spacer -->
<div class="h-6"></div>
</main>
<script>
        // Simple password toggle logic
        document.querySelectorAll('button[aria-label="Mostrar contraseña"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                    icon.setAttribute('data-icon', 'visibility_off');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                    icon.setAttribute('data-icon', 'visibility');
                }
            });
        });
    </script>
</body></html>
