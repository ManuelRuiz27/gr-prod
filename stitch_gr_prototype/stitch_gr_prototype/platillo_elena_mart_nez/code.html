<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Scrim animation */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 0.4; }
        }
        
        /* Bottom sheet animation */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .scrim {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        .bottom-sheet {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Custom radio input styling */
        input[type="radio"]:checked + div {
            border-color: #031636;
            background-color: #eff3ff;
        }
        
        input[type="radio"]:checked + div .radio-indicator {
            border-color: #031636;
        }
        
        input[type="radio"]:checked + div .radio-indicator::after {
            transform: scale(1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-app-bg text-on-surface h-screen w-full relative overflow-hidden flex flex-col items-center justify-end">
<!-- Scrim (Background Overlay) -->
<div class="absolute inset-0 bg-primary/40 backdrop-blur-sm z-40 scrim"></div>
<!-- Bottom Sheet -->
<div class="bottom-sheet bg-surface w-full max-w-md mx-auto rounded-t-[24px] shadow-[0_-8px_24px_rgba(3,22,54,0.08)] z-50 flex flex-col pb-safe relative">
<!-- Drag Handle Indicator -->
<div class="w-full flex justify-center pt-stack-sm pb-stack-md">
<div class="w-12 h-1.5 bg-border rounded-full"></div>
</div>
<!-- Header -->
<div class="px-margin-page pb-stack-lg border-b border-border flex justify-between items-center">
<div>
<h2 class="font-headline-h2 text-headline-h2 text-primary">Platillo para Elena Martínez</h2>
<p class="font-body-md text-body-md text-text-secondary mt-1">Selecciona una opción de menú</p>
</div>
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-text-secondary hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Content Options (Tiles) -->
<div class="p-margin-page flex flex-col gap-stack-md">
<!-- Option 1: Tradicional -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="meal_selection" type="radio" value="tradicional"/>
<div class="flex items-center justify-between p-stack-md rounded-xl border border-border bg-surface transition-all duration-200 hover:border-outline-variant">
<div class="flex items-center gap-stack-md">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:bg-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div>
<h3 class="font-headline-h3 text-headline-h3 text-on-surface">Tradicional</h3>
<p class="font-caption-sm text-caption-sm text-text-secondary mt-0.5">Menú estándar del evento</p>
</div>
</div>
<!-- Radio Indicator -->
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-border relative flex items-center justify-center transition-colors">
<div class="w-3 h-3 rounded-full bg-primary absolute transform scale-0 transition-transform duration-200 content-['']"></div>
</div>
</div>
</label>
<!-- Option 2: Vegetariano -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="meal_selection" type="radio" value="vegetariano"/>
<div class="flex items-center justify-between p-stack-md rounded-xl border border-border bg-surface transition-all duration-200 hover:border-outline-variant">
<div class="flex items-center gap-stack-md">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:bg-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">eco</span>
</div>
<div>
<h3 class="font-headline-h3 text-headline-h3 text-on-surface">Vegetariano</h3>
<p class="font-caption-sm text-caption-sm text-text-secondary mt-0.5">Sin carne, pollo o pescado</p>
</div>
</div>
<!-- Radio Indicator -->
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-border relative flex items-center justify-center transition-colors">
<div class="w-3 h-3 rounded-full bg-primary absolute transform scale-0 transition-transform duration-200 content-['']"></div>
</div>
</div>
</label>
<!-- Option 3: Vegano -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="meal_selection" type="radio" value="vegano"/>
<div class="flex items-center justify-between p-stack-md rounded-xl border border-border bg-surface transition-all duration-200 hover:border-outline-variant">

<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:bg-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">local_florist</span>
</div>
<div>
<h3 class="font-headline-h3 text-headline-h3 text-on-surface">Vegano</h3>
<p class="font-caption-sm text-caption-sm text-text-secondary mt-0.5">Libre de productos de origen animal</p>
</div>
</div>
<!-- Radio Indicator -->
<div class="radio-indicator w-6 h-6 rounded-full border-2 border-border relative flex items-center justify-center transition-colors">
<div class="w-3 h-3 rounded-full bg-primary absolute transform scale-0 transition-transform duration-200 content-['']"></div>
</div>
</div>
</label>
