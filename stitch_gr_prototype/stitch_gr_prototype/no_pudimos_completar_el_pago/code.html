<!-- Ambient Background Element to maintain premium Sober Elite feel despite error -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-[-20%] left-[-10%] w-[150%] h-[150%] bg-gradient-to-br from-error-light/30 via-transparent to-primary-fixed/20 rounded-full blur-3xl transform rotate-12"></div>
</div>
<!-- Top App Bar (Simplified for Transactional State) -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-border flat no shadows flex justify-between items-center h-button-height px-margin-page max-w-7xl mx-auto md:hidden">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-start text-primary active:scale-95 duration-150 transition-transform">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-h3 text-headline-h3 text-primary text-center absolute left-1/2 transform -translate-x-1/2 w-3/4 truncate">
            Pago Rechazado
        </h1>
<div class="w-touch-target-min h-touch-target-min"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md z-10 flex flex-col items-center justify-center mt-button-height md:mt-0 flex-grow">
<!-- Error Illustration / Icon Container -->
<div class="w-24 h-24 rounded-full bg-error-light border-4 border-surface shadow-sm flex items-center justify-center mb-stack-lg relative">
<div class="absolute inset-0 bg-error/10 rounded-full animate-ping opacity-50"></div>
<span class="material-symbols-outlined text-4xl text-error icon-fill" data-icon="credit_card_off">credit_card_off</span>
<!-- Warning Badge Overly -->
<div class="absolute -bottom-2 -right-2 bg-surface rounded-full p-1 shadow-sm">
<div class="bg-warning rounded-full w-8 h-8 flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-sm" data-icon="warning">warning</span>
</div>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-stack-sm mb-stack-lg px-4">
<h2 class="font-headline-h1 text-headline-h1 text-primary">No pudimos completar el pago</h2>
<p class="font-body-md text-body-md text-text-secondary">No se realizó ningún cargo confirmado.</p>
</div>

<div class="flex justify-between items-center border-border pb-stack-sm">

<span class="font-label-btn text-label-btn text-primary line-through opacity-70">$2,500 MXN</span>
</div>

</div>

<button class="w-full h-button-height bg-surface border border-primary text-primary font-label-btn text-label-btn rounded flex justify-center items-center hover:bg-surface-container-low active:scale-[0.98] transition-all">
