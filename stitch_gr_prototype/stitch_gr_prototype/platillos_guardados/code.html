<style>

        }
        
        /* Custom Keyframe Animations for a Premium Micro-interaction Feel */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes scalePop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes subtlePulse {
            0% { box-shadow: 0 0 0 0 rgba(254, 214, 91, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(254, 214, 91, 0); }
            100% { box-shadow: 0 0 0 0 rgba(254, 214, 91, 0); }
        }

        .animate-fade-in-up {
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .animate-scale-pop {
            animation: scalePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .delay-200 { animation-delay: 0.2s; }
