<!DOCTYPE html>

<html lang="es"><head>

                      "secondary-container": "#fed65b",
                      "on-surface-variant": "#44474e",
                      "background": "#f8f9ff",

                      "secondary-fixed-dim": "#e9c349",

                      "on-tertiary-fixed-variant": "#1d4f40",

                      "on-secondary-fixed-variant": "#574500",
                      "on-secondary-container": "#745c00",
                      "surface-container-lowest": "#ffffff",
                      "text-secondary": "#667085",
                      "border": "#D0D5DD",
                      "on-primary": "#ffffff",
                      "on-error": "#ffffff",
                      "surface-container-high": "#e1e8f9",

                      "on-secondary-fixed": "#241a00",

              "borderRadius": {

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-app-bg text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Conceptual Linear Screen: No Navigation Shells Rendered -->
<main class="flex-grow flex flex-col px-margin-page py-12 max-w-md mx-auto w-full md:justify-center">
<!-- Subtle Branding/Icon -->
<div class="mb-stack-lg flex justify-center md:justify-start">
<div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
                    school
                </span>
</div>
</div>
<!-- Header Section -->
<header class="mb-stack-lg space-y-stack-sm text-center md:text-left">
<h1 class="font-headline-h1 text-headline-h1 text-primary">Accede a tu graduación</h1>
<p class="font-body-md text-body-md text-text-secondary">
                Ingresa el código que te proporcionó tu organizador.
            </p>
</header>
<!-- Form Section -->
<form class="space-y-stack-md" onsubmit="event.preventDefault(); toggleError();">
<div class="space-y-base relative">
<label class="font-caption-sm text-caption-sm text-on-surface-variant block" for="eventCode">
                    Código del evento
                </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary group-focus-within:text-primary transition-colors">
                        key
                    </span>
<input class="w-full h-button-height pl-12 pr-4 bg-surface border border-border rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all uppercase tracking-wider" id="eventCode" name="eventCode" placeholder="Ej. GRAD2027" required="" type="text"/>
</div>
<!-- Error State (Hidden by default) -->
<p class="hidden font-caption-sm text-caption-sm text-error mt-2 flex items-center gap-1 animate-fade-in" id="errorMessage">
<span class="material-symbols-outlined text-[16px]">error</span>
                    No encontramos un evento con ese código. Revisa e inténtalo nuevamente.
                </p>
</div>
<div class="pt-stack-sm space-y-stack-md">
<button class="w-full h-button-height bg-primary text-on-primary rounded-DEFAULT font-label-btn text-label-btn flex items-center justify-center gap-2 hover:bg-primary-container active:scale-[0.98] transition-all shadow-sm" type="submit">
                    Continuar
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="w-full h-min-touch-target min-h-[44px] text-primary font-label-btn text-label-btn flex items-center justify-center hover:bg-surface-container-lowest rounded-DEFAULT transition-colors" type="button">
                    Ya tengo una cuenta
                </button>
</div>
</form>
</main>
<script>
        // Simple mock interaction for demonstration
        function toggleError() {
            const input = document.getElementById('eventCode');
            const errorMsg = document.getElementById('errorMessage');
            
            // Simulate error if input is not exactly 'DEMO'
            if (input.value.toUpperCase() !== 'DEMO') {
                input.classList.remove('border-border', 'focus:ring-primary');
                input.classList.add('border-error', 'focus:ring-error', 'text-error');
                errorMsg.classList.remove('hidden');
                
                // Shake effect
                input.parentElement.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 400, easing: 'ease-in-out' });
            } else {
                input.classList.add('border-border', 'focus:ring-primary');
                input.classList.remove('border-error', 'focus:ring-error', 'text-error');
                errorMsg.classList.add('hidden');
                alert('Success! Code accepted.');
            }
        }

        // Add CSS animation for error fade in
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(-4px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in {
                animation: fadeIn 0.2s ease-out forwards;
            }
        `;
        document.head.appendChild(style);
    </script>
</body></html>
