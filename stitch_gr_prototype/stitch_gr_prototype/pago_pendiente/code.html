<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pago Pendiente</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .pulse-container {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .pulse-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: theme('colors.warning-light');
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#baeed9",
                        "text-secondary": "#667085",
                        "surface-container-highest": "#dbe3f3",
                        "border": "#D0D5DD",
                        "primary-container": "#1a2b4c",
                        "app-bg": "#F8F9FA",
                        "background": "#f8f9ff",
                        "surface-container-low": "#eff3ff",
                        "primary-fixed": "#d8e2ff",
                        "on-surface-variant": "#44474e",
                        "success-light": "#E8F5E9",
                        "on-primary": "#ffffff",
                        "outline": "#75777f",
                        "surface-container-high": "#e1e8f9",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#1d4f40",
                        "inverse-on-surface": "#ebf1ff",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#6c9d8b",
                        "outline-variant": "#c5c6cf",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#dbe3f3",
                        "secondary-fixed": "#ffe088",
                        "secondary": "#735c00",
                        "surface-dim": "#d2daeb",
                        "on-secondary-fixed": "#241a00",
                        "on-tertiary-fixed": "#002117",
                        "on-primary-fixed-variant": "#364669",
                        "tertiary-fixed-dim": "#9ed1bd",
                        "on-error-container": "#93000a",
                        "tertiary": "#001c14",
                        "surface": "#FFFFFF",
                        "on-primary-container": "#8293ba",
                        "on-primary-fixed": "#071b3b",
                        "primary-fixed-dim": "#b6c6f0",
                        "surface-container": "#e6eeff",
                        "warning": "#B76E00",
                        "error-light": "#FFEBEE",
                        "surface-bright": "#f8f9ff",
                        "secondary-fixed-dim": "#e9c349",
                        "error-container": "#ffdad6",
                        "secondary-container": "#fed65b",
                        "on-surface": "#141c28",
                        "warning-light": "#FFF8E1",
                        "inverse-primary": "#b6c6f0",
                        "primary": "#031636",
                        "on-secondary-container": "#745c00",
                        "surface-tint": "#4e5e82",
                        "error": "#9A2A2A",
                        "tertiary-container": "#003326",
                        "on-background": "#141c28",
                        "inverse-surface": "#29313d",
                        "on-secondary-fixed-variant": "#574500"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-lg": "24px",
                        "margin-page": "20px",
                        "touch-target-min": "44px",
                        "stack-md": "16px",
                        "button-height": "48px",
                        "gutter-card": "16px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "caption-sm": ["Inter", "sans-serif"],
                        "headline-h2": ["Inter", "sans-serif"],
                        "headline-h3": ["Inter", "sans-serif"],
                        "headline-h1": ["Inter", "sans-serif"],
                        "display-hero": ["Inter", "sans-serif"],
                        "label-btn": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "caption-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-h2": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-h3": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-h1": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "display-hero": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-btn": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-app-bg text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-margin-page">
<!-- Main Content Canvas -->
<main class="w-full max-w-[390px] mx-auto bg-surface rounded-xl border border-border flex flex-col items-center justify-center p-stack-lg text-center shadow-[0_4px_24px_rgba(0,0,0,0.02)] min-h-[400px]">
<!-- Status Icon -->
<div class="mb-stack-lg pulse-container w-24 h-24">
<div class="pulse-circle"></div>
<div class="w-20 h-20 bg-warning-light rounded-full flex items-center justify-center z-10 relative shadow-sm">
<span class="material-symbols-outlined text-[40px] text-warning" data-icon="schedule" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    schedule
                </span>
</div>
</div>
<!-- Typography -->
<div class="flex flex-col gap-stack-sm mb-stack-lg w-full">
<h1 class="font-headline-h1 text-headline-h1 text-on-surface">
                Pago pendiente
            </h1>
<p class="font-body-md text-body-md text-text-secondary px-stack-md">
                Tu pago todavía está siendo procesado.
            </p>
</div>
<!-- CTA -->
<div class="w-full mt-auto pt-stack-md">
<button class="w-full h-button-height bg-primary text-on-primary font-label-btn text-label-btn rounded-DEFAULT flex items-center justify-center transition-transform active:scale-95">
                Volver a mis pagos
            </button>
</div>
</main>
</body></html>
