<body class="bg-app-bg text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-fixed selection:text-primary">
<!-- TopAppBar (Simplified for transactional screen) -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-border flex justify-between items-center h-button-height px-margin-page max-w-7xl mx-auto left-0 right-0">
<button aria-label="Volver" class="w-touch-target-min h-touch-target-min flex items-center justify-start text-primary active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<!-- Title omitted to keep focus on the main canvas message -->
<div class="w-touch-target-min"></div>
</header>
<!-- Main Canvas (Transactional/Status Screen) -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-page pt-button-height w-full max-w-md mx-auto">
<!-- Status Card (Level 1 Elevation: Surface with Border) -->
<div class="bg-surface border border-border rounded-xl p-stack-lg w-full flex flex-col items-center text-center shadow-[0_8px_16px_rgba(0,0,0,0.02)]">
<!-- Gilded Accent Icon Container -->
<div class="w-16 h-16 rounded-full bg-warning-light flex items-center justify-center mb-stack-md relative overflow-hidden">
<!-- Subtle pulsing effect for the status change -->
<div class="absolute inset-0 bg-warning opacity-10 animate-ping rounded-full" style="animation-duration: 3s;"></div>
<span class="material-symbols-outlined text-[32px] text-warning relative z-10" data-icon="sync_problem" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sync_problem</span>
</div>
<!-- Typography -->
<h1 class="font-headline-h2 text-headline-h2 text-primary mb-stack-sm">
                Esta mesa acaba de cambiar
            </h1>
<p class="font-body-md text-body-md text-text-secondary mb-stack-lg max-w-[280px]">
                Ya no hay suficientes lugares disponibles para tu grupo. Elige otra mesa.
            </p>
<!-- Primary CTA (Azure) -->
<button class="w-full bg-primary text-on-primary font-label-btn text-label-btn h-button-height rounded flex items-center justify-center hover:bg-surface-tint transition-colors active:scale-95 duration-200">
                Ver mesas disponibles
            </button>
</div>
