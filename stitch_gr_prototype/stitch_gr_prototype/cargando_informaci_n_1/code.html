<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando información</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite ease-in-out;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <!-- Header Skeleton -->
    <div class="h-16 bg-white border-b border-[#D0D5DD] flex items-center px-4 justify-between">
        <div class="w-10 h-10 rounded-full skeleton"></div>
        <div class="w-40 h-6 rounded skeleton"></div>
        <div class="w-10 h-10 rounded-full skeleton"></div>
    </div>

    <main class="flex-grow p-4 space-y-6">
        <!-- Event Header Skeleton -->
        <div class="space-y-2">
            <div class="w-3/4 h-8 rounded skeleton"></div>
            <div class="w-1/2 h-4 rounded skeleton"></div>
        </div>

        <!-- Financial Card Skeleton -->
        <div class="bg-white rounded-xl p-6 border border-[#D0D5DD] space-y-4">
            <div class="flex justify-between items-end">
                <div class="space-y-2">
                    <div class="w-20 h-4 rounded skeleton"></div>
                    <div class="w-32 h-8 rounded skeleton"></div>
                </div>
                <div class="w-16 h-6 rounded-full skeleton"></div>
            </div>
            <div class="w-full h-2 rounded skeleton"></div>
            <div class="flex justify-between">
                <div class="w-24 h-4 rounded skeleton"></div>
                <div class="w-24 h-4 rounded skeleton"></div>
            </div>
        </div>

        <!-- Action Card Skeleton -->
        <div class="bg-[#FFF8E1] rounded-xl p-6 border border-[#D0D5DD] space-y-4">
            <div class="flex items-start space-x-3">
                <div class="w-6 h-6 rounded skeleton"></div>
                <div class="space-y-2 flex-grow">
                    <div class="w-3/4 h-5 rounded skeleton"></div>
                    <div class="w-full h-4 rounded skeleton"></div>
                </div>
            </div>
            <div class="w-full h-12 rounded-lg skeleton"></div>
        </div>

        <!-- List Item Skeletons -->
        <div class="space-y-4">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 rounded-lg skeleton"></div>
                <div class="flex-grow space-y-2">
                    <div class="w-1/3 h-5 rounded skeleton"></div>
                    <div class="w-1/4 h-4 rounded skeleton"></div>
                </div>
                <div class="w-6 h-6 rounded skeleton"></div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 rounded-lg skeleton"></div>
                <div class="flex-grow space-y-2">
                    <div class="w-1/3 h-5 rounded skeleton"></div>
                    <div class="w-1/4 h-4 rounded skeleton"></div>
                </div>
                <div class="w-6 h-6 rounded skeleton"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Nav Skeleton -->
    <div class="h-20 bg-white border-t border-[#D0D5DD] flex justify-around items-center pb-safe">
        <div class="flex flex-col items-center space-y-1">
            <div class="w-6 h-6 rounded skeleton"></div>
            <div class="w-10 h-3 rounded skeleton"></div>
        </div>
        <div class="flex flex-col items-center space-y-1">
            <div class="w-6 h-6 rounded skeleton"></div>
            <div class="w-10 h-3 rounded skeleton"></div>
        </div>
        <div class="flex flex-col items-center space-y-1">
            <div class="w-6 h-6 rounded skeleton"></div>
            <div class="w-10 h-3 rounded skeleton"></div>
        </div>
        <div class="flex flex-col items-center space-y-1">
            <div class="w-6 h-6 rounded skeleton"></div>
            <div class="w-10 h-3 rounded skeleton"></div>
        </div>
    </div>
</body>
</html>
