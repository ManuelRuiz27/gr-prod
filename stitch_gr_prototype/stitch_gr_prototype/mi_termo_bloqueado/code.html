<!-- Subtle atmospheric effect scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Animate progress bar on load
            const progressBar = document.querySelector('.bg-secondary-fixed-dim');
            if (progressBar) {
                progressBar.style.width = '0%';
                setTimeout(() => {
                    progressBar.style.width = '60%';
                }, 300);
            }
        });
