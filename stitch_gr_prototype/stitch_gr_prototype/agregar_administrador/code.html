<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                        "app-bg": "#F8F9FA",

                        "on-secondary-fixed-variant": "#574500",
                        "secondary-container": "#fed65b",
                        "on-secondary-container": "#745c00",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#9ed1bd",
                        "tertiary-container": "#003326",
                        "secondary-fixed": "#ffe088",
                        "outline-variant": "#c5c6cf",
                        "outline": "#75777f",

                    "borderRadius": {

                        "lg": "0.5rem",

                    "spacing": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scrim {
            background-color: rgba(3, 22, 54, 0.4); /* primary 40% */
            backdrop-filter: blur(4px);
        }
        .modal-shadow {
            box-shadow: 0 16px 32px rgba(3, 22, 54, 0.08);
        }
    </style>
</head>
<body class="bg-app-bg text-on-background min-h-screen font-body-md antialiased flex items-center justify-center p-margin-page relative">
<!-- Scrim / Backdrop -->
<div class="fixed inset-0 scrim z-40 transition-opacity duration-300" id="modal-backdrop"></div>
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="relative z-50 w-full max-w-md bg-surface rounded-xl modal-shadow border border-border flex flex-col transform transition-all duration-300 scale-100 opacity-100" role="dialog">
<!-- Modal Header -->
<div class="flex items-center justify-between px-stack-lg py-stack-md border-b border-border">
<h2 class="font-headline-h2 text-headline-h2 text-on-surface" id="modal-title">Agregar administrador</h2>
<button aria-label="Cerrar" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-text-secondary hover:text-on-surface transition-colors rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="px-stack-lg py-stack-lg flex flex-col gap-stack-lg">
<p class="font-body-md text-body-md text-text-secondary">
                Esta persona tendrá acceso administrativo a Plataforma GR.
            </p>
<form class="flex flex-col gap-stack-md">
<!-- Nombre Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-btn text-label-btn text-on-surface" for="admin-name">Nombre</label>
<input class="h-button-height px-4 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-outline-variant transition-colors" id="admin-name" name="name" placeholder="Ingresa el nombre" type="text"/>
</div>
<!-- Correo Electrónico Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-btn text-label-btn text-on-surface" for="admin-email">Correo electrónico</label>
<input class="h-button-height px-4 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-outline-variant transition-colors" id="admin-email" name="email" placeholder="ejemplo@correo.com" type="email"/>
</div>
</form>
</div>
<!-- Modal Footer -->
<div class="px-stack-lg py-stack-md border-t border-border flex flex-col sm:flex-row justify-end gap-stack-sm bg-surface-container-lowest rounded-b-xl">
<button class="h-button-height px-stack-md min-w-[120px] bg-surface border border-primary text-primary font-label-btn text-label-btn rounded-lg hover:bg-surface-container-low transition-colors" type="button">
                Cancelar
            </button>
<button class="h-button-height px-stack-md min-w-[120px] bg-primary text-on-primary font-label-btn text-label-btn rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined" style="font-size: 20px;">send</span>
                Enviar invitación
            </button>
</div>
</div>
</body></html>
