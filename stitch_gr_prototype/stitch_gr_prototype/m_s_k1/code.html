<!DOCTYPE html><html class="light" lang="es" style=""><head>
<meta charset="utf-8">

<title>Más</title>

                        "primary-container": "#1a2b4c",

                        "secondary-container": "#fed65b",
                        "outline-variant": "#c5c6cf",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e1e8f9",
                        "secondary-fixed": "#ffe088",
                        "surface-tint": "#4e5e82",
                        "surface-container-low": "#eff3ff",
                        "on-background": "#141c28",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#b6c6f0",
                        "border": "#D0D5DD",
                        "warning": "#B76E00",
                        "on-primary-fixed-variant": "#364669",
                        "on-primary-container": "#8293ba",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#75777f",
                        "secondary": "#735c00",
                        "background": "#f8f9ff",
                        "on-tertiary-container": "#6c9d8b",
                        "primary-fixed": "#d8e2ff",

                        "inverse-surface": "#29313d",

                        "inverse-primary": "#b6c6f0",

                        "warning-light": "#FFF8E1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "44px",
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "button-height": "48px",
                        "gutter-card": "16px",
                        "base": "4px",
                        "margin-page": "20px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-h2": ["Inter"],

                    "fontSize": {

                        "label-btn": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }]

                }
            }
        }

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-app-bg text-on-surface min-h-screen flex flex-col font-body-md antialiased pb-[64px]">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-background border-b border-border dark:border-outline-variant flat no shadows">
<div class="flex justify-between items-center h-button-height px-margin-page w-full max-w-7xl mx-auto">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-start text-primary dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-primary-container transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-h3 text-headline-h3 text-primary dark:text-primary-fixed truncate px-4">
                Menú
            </h1>
<div class="w-touch-target-min h-touch-target-min flex items-center justify-end text-primary dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-primary-container transition-colors active:scale-95 duration-150">
<!-- Space for balance -->
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-[48px] px-margin-page py-stack-lg max-w-3xl mx-auto w-full flex flex-col gap-stack-lg">
<!-- User Profile Header Summary -->
<div class="bg-surface rounded-lg border border-border p-gutter-card flex items-center gap-stack-md">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex-shrink-0 overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A close-up, high-key professional portrait of a modern graduate. The lighting is soft and bright, emphasizing a clean, contemporary aesthetic consistent with a premium service. The background is a crisp, pure white. The subject exudes confidence and reliability, fitting for a sophisticated milestone event platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpHouGrSwWWDP2IURaBu9BihPHRmHfNn9iqjwfjDZljivyEBkQWy3jkWc5g5-gV6AcuReFzsExyCHRunKsal3SK5wArZ1U38ihCTWFbkSdFIiQEBu0xBlNdkXeJy9A3jiy3EXnqyt74GWIWurqHa_u2B7OND4jIuKPBj0yqRhR2iML9M-d179o_bi7n2sbadusHYcUUC-fOQFI00WdQSMH15HaUpb01JN8d6aFK9kZxx2PyLMToF7bpA">
</div>
<div class="flex flex-col">
<h2 class="font-headline-h2 text-headline-h2 text-on-surface">Andrea Martínez</h2>
<p class="font-body-md text-body-md text-text-secondary">Graduación Facultad de Derecho 2027</p>
</div>
</div>
<!-- Options List -->
<div class="bg-surface rounded-lg border border-border overflow-hidden flex flex-col">
<!-- Option: Mi perfil -->
<button class="w-full flex items-center justify-between p-gutter-card hover:bg-surface-container-low transition-colors border-b border-border last:border-b-0 active:scale-[0.99] duration-150 group">
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined text-primary group-hover:text-secondary-fixed-dim transition-colors" data-icon="person">person</span>
<span class="font-body-md text-body-md text-on-surface font-medium">Mi perfil</span>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Option: Notificaciones -->
<button class="w-full flex items-center justify-between p-gutter-card hover:bg-surface-container-low transition-colors border-b border-border last:border-b-0 active:scale-[0.99] duration-150 group">
<div class="flex items-center gap-stack-md">
<div class="relative">
<span class="material-symbols-outlined text-primary group-hover:text-secondary-fixed-dim transition-colors" data-icon="notifications">notifications</span>
<div class="absolute top-0 right-0 w-2 h-2 bg-warning rounded-full border border-surface"></div>
</div>
<span class="font-body-md text-body-md text-on-surface font-medium">Notificaciones</span>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Option: Ayuda -->
<button class="w-full flex items-center justify-between p-gutter-card hover:bg-surface-container-low transition-colors border-b border-border last:border-b-0 active:scale-[0.99] duration-150 group">
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined text-primary group-hover:text-secondary-fixed-dim transition-colors" data-icon="help">help</span>
<span class="font-body-md text-body-md text-on-surface font-medium">Ayuda</span>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Option: Cambiar evento -->
<button class="w-full flex items-center justify-between p-gutter-card hover:bg-surface-container-low transition-colors border-b border-border last:border-b-0 active:scale-[0.99] duration-150 group">
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined text-primary group-hover:text-secondary-fixed-dim transition-colors" data-icon="swap_horiz">swap_horiz</span>
<span class="font-body-md text-body-md text-on-surface font-medium">Cambiar evento</span>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Option: Cerrar sesión -->
<button class="w-full flex items-center justify-between p-gutter-card hover:bg-error-light transition-colors border-b border-border last:border-b-0 active:scale-[0.99] duration-150 group">
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined text-error" data-icon="logout">logout</span>
<span class="font-body-md text-body-md text-error font-medium">Cerrar sesión</span>
</div>
<!-- No chevron for terminal actions -->
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 h-16 bg-surface dark:bg-background border-t border-border dark:border-outline-variant flat no shadows md:hidden">
<div class="flex justify-around items-center w-full px-margin-page pb-safe h-full">
<button class="flex flex-col items-center justify-center text-text-secondary dark:text-on-surface-variant hover:bg-surface-container-lowest dark:hover:bg-primary-container transition-all active:scale-90 duration-200 w-full h-full">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-caption-sm text-caption-sm mt-1">Inicio</span>
</button>
<button class="flex flex-col items-center justify-center text-text-secondary dark:text-on-surface-variant hover:bg-surface-container-lowest dark:hover:bg-primary-container transition-all active:scale-90 duration-200 w-full h-full">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-caption-sm text-caption-sm mt-1">Mi grupo</span>
</button>
<button class="flex flex-col items-center justify-center text-text-secondary dark:text-on-surface-variant hover:bg-surface-container-lowest dark:hover:bg-primary-container transition-all active:scale-90 duration-200 w-full h-full">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-caption-sm text-caption-sm mt-1">Pagos</span>
</button>
<button class="flex flex-col items-center justify-center text-primary dark:text-secondary-fixed-dim font-semibold hover:bg-surface-container-lowest dark:hover:bg-primary-container transition-all active:scale-90 duration-200 w-full h-full">
<span class="material-symbols-outlined filled" data-icon="menu" data-weight="fill">menu</span>
<span class="font-caption-sm text-caption-sm mt-1">Más</span>
</button>
</div>
</nav>
<!-- Web Nav Placeholder for Desktop (hidden on mobile, nav shell logic) -->
<nav class="hidden md:flex fixed top-0 left-0 h-screen w-64 border-r border-border bg-surface flex-col pt-[48px]">
<!-- Desktop nav items would go here if this was a full responsive build, 
             but following the strict JSON implementation for BottomNavBar -->
<div class="p-gutter-card text-text-secondary font-caption-sm">Desktop Nav Area</div>
</nav>




</body></html>
