<!DOCTYPE html>

<html lang="es"><head>

                        "primary-container": "#1a2b4c",
                        "success-light": "#E8F5E9",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {

                        "stack-lg": "24px",

                        "gutter-card": "16px"

                    "fontFamily": {

<style>
        body {
            background-color: theme('colors.app-bg');
            color: theme('colors.on-surface');
        }
        .input-field {
            @apply w-full h-button-height px-4 py-2 border border-border rounded-lg bg-surface text-body-md font-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex items-center justify-center p-margin-page">
<main class="w-full max-w-[390px] mx-auto bg-surface rounded-xl border border-border overflow-hidden relative shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
<!-- Decorative Header Image/Pattern -->
<div class="h-40 w-full relative">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A sophisticated, abstract architectural composition featuring minimal geometric forms in a high-key light environment. Soft, diffused lighting highlights subtle textures on pristine white surfaces, while deep navy blue (primary color) structural accents provide a sense of grounded elegance. The overall mood is premium, academic, and modern, resembling a high-end university campus or luxury concourse." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAKQbii9gBGsG5u61Os42kG99QFsF-_iPgODlpekULSnLiagryYaDsh6l8YNaBoXYuxAV8VDvxk56DpX0B8oOa3nIs5DO1cUPpKSRTFKyao11pFBDheZP2O-zSx--55wEQKx2_98eELC-BoyGuySoHO96bpCd6d2Qq_q59DxjhP8n4lJXrEesPOckr3B-HcQ6PhQGXdSnziS_hUo-WiG-Mr7Xi0Nm-yl0q1dUZnOL33aPdYZV8WEDwycg')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-surface to-transparent"></div>
</div>
<div class="p-stack-lg relative z-10 -mt-10">
<!-- Brand & Titles -->
<div class="text-center mb-stack-lg">
<h1 class="font-display-hero text-display-hero text-primary mb-stack-sm tracking-tight">Plataforma GR</h1>
<p class="font-body-md text-body-md text-text-secondary">Tu graduación, en un solo lugar.</p>
</div>
<!-- Login Form -->
<form class="space-y-stack-md">
<div class="space-y-stack-sm">
<label class="font-label-btn text-label-btn text-on-surface block" for="email">Correo electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="input-field pl-10" id="email" placeholder="ejemplo@correo.com" required="" type="email"/>
</div>
</div>
<div class="space-y-stack-sm">
<label class="font-label-btn text-label-btn text-on-surface block" for="password">Contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="input-field pl-10 pr-10" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-secondary hover:text-primary transition-colors h-touch-target-min w-touch-target-min flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<div class="flex justify-end pt-base">
<a class="font-body-md text-body-md text-primary hover:text-primary-container transition-colors" href="#">Olvidé mi contraseña</a>
</div>
<div class="pt-stack-md">
<button class="w-full h-button-height bg-primary text-on-primary font-label-btn text-label-btn rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Iniciar sesión
                        <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-stack-lg pt-stack-md border-t border-border/50 text-center">
<a class="inline-flex items-center gap-2 font-label-btn text-label-btn text-text-secondary hover:text-primary transition-colors h-touch-target-min" href="#">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">confirmation_number</span>
                    Tengo un código de evento
                </a>
</div>
</div>
</main>
</body></html>
