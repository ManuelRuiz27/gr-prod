<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171A" />
      <stop offset="50%" stop-color="#0D0F11" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EFCF" />
      <stop offset="35%" stop-color="#DEC889" />
      <stop offset="70%" stop-color="#C6A85B" />
      <stop offset="100%" stop-color="#94772F" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEC889" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C6A85B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#94772F" stop-opacity="0.8" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#C6A85B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Shape -->
  <rect width="512" height="512" rx="112" fill="url(#obsidianBg)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.6" />
  <rect x="28" y="28" width="456" height="456" rx="86" fill="none" stroke="#DEC889" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3" />

  <!-- Inner Diamond Emblem -->
  <g transform="translate(256, 120)" opacity="0.85">
    <path d="M 0 -18 L 12 0 L 0 18 L -12 0 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Monogram GR -->
  <g filter="url(#goldGlow)">
    <text
      x="256"
      y="320"
      font-family="'Cormorant Garamond', 'Georgia', 'Times New Roman', serif"
      font-size="190"
      font-weight="700"
      letter-spacing="4"
      fill="url(#goldGrad)"
      text-anchor="middle"
    >GR</text>
  </g>

  <!-- Subtitle Bar -->
  <line x1="160" y1="365" x2="352" y2="365" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5" />
  <text
    x="256"
    y="405"
    font-family="'Inter', 'Helvetica Neue', sans-serif"
    font-size="24"
    font-weight="600"
    letter-spacing="9"
    fill="#E3E6E8"
    text-anchor="middle"
    opacity="0.9"
  >PLATAFORMA</text>
</svg>
