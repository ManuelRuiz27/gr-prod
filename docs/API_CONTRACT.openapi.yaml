    description: Integrantes del grupo nominal
  - name: GraduateMeals
    description: Selección de platillos por integrante
  - name: GraduateSeating
    description: Croquis seguro y asignación de mesas
  - name: GraduateFinance
    description: Plan de pagos, intentos y comprobantes
  - name: GraduateThermos
    description: Elegibilidad, solicitud y personalización de termo
  - name: GraduateNotifications
    description: Notificaciones de graduado
  - name: AdminEvents
    description: Gestión y ciclo de vida de eventos
  - name: AdminProducts
    description: Catálogo de productos y precios por evento
  - name: AdminFinancialConfig
    description: Versiones de configuración financiera y parcialidades
  - name: AdminGraduates
    description: Expediente, cartera y notas internas de graduados
  - name: AdminPayments
    description: Cobros manuales, comprobantes, reembolsos y conciliación
  - name: AdminSeating
    description: Croquis, mesas, asignaciones e importación asistida
  - name: AdminMeals
    description: Catálogo de platillos y overrides de selección
  - name: AdminThermos
    description: Configuración, producción y entrega de termos
  - name: AdminReports
    description: Reportes operativos, financieros y cortes de caja
  - name: AdminExports
    description: Exportaciones asíncronas seguras
  - name: AdminAudit
    description: Registro inmutable de auditoría
  - name: AdminAccounts
    description: Gestión de cuentas y accesos administrativos
  - name: Files
    description: Carga y descarga segura de archivos
  - name: Webhooks
