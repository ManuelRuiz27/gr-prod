components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT de sesión emitido tras autenticación exitosa (duración
        baseline: 15 minutos)."
  schemas:
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorObject"
    ErrorObject:
      type: object
      required:
        - code
        - message
        - details
        - request_id
      properties:
        code:
          type: string
          description: Código de error canónico y estable (ej. TABLE_CAPACITY_CHANGED,
            EVENT_CAPACITY_EXCEEDED, IDEMPOTENCY_KEY_REUSED).
          example: TABLE_CAPACITY_CHANGED
        message:
          type: string
          description: Mensaje seguro para presentación en la interfaz de usuario.
          example: La disponibilidad cambió. Actualiza el croquis.
        details:
          type: object
          description: Detalles contextuales adicionales no confidenciales.
          additionalProperties: true
        request_id:
          type: string
          format: uuid
          description: Identificador único del request para trazabilidad y auditoría.
          example: 9c58c2b7-8494-4d16-953e-2bfa91d34c11
    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          example: 45
        total_pages:
          type: integer
          minimum: 0
          example: 3
    Money:
      type: string
      pattern: ^-?\d+(\.\d{2})?$
      description: Importe monetario en MXN serializado como string decimal exacto.
      example: "2500.00"
    NormalizedCoordinate:
      type: string
      pattern: ^0(\.\d+)?$|^1(\.0+)?$
      description: Coordenada normalizada entre 0.00000000 y 1.00000000.
      example: "0.45000000"
    MealType:
      type: string
      enum:
        - STANDARD
        - VEGETARIAN
        - VEGAN
        - OTHER
      description: Clasificación canónica del platillo.
      example: STANDARD
    MealOption:
      type: object
      required:
        - id
        - event_id
        - name
        - type
        - is_vegetarian
        - is_vegan
        - is_active
        - display_order
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/MealType"
        is_vegetarian:
          type: boolean
        is_vegan:
          type: boolean
        is_active:
          type: boolean
        display_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MealOptionCreateInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/MealType"
        is_vegetarian:
          type: boolean
        is_vegan:
          type: boolean
        display_order:
          type: integer
    MealOptionUpdateInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/MealType"
        is_vegetarian:
          type: boolean
        is_vegan:
          type: boolean
        is_active:
          type: boolean
        display_order:
          type: integer
    MealSelection:
      type: object
      required:
        - id
        - group_member_id
        - meal_option_id
        - selected_at
      properties:
        id:
          type: string
          format: uuid
        group_member_id:
          type: string
          format: uuid
        meal_option_id:
          type: string
          format: uuid
        selected_at:
          type: string
          format: date-time
    MealSelectionInput:
      type: object
      required:
        - group_member_id
        - meal_option_id
      properties:
        group_member_id:
          type: string
          format: uuid
        meal_option_id:
          type: string
          format: uuid
