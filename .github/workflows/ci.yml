name: CI Baseline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  backend-ci:
    name: Backend CI (Lint, Typecheck, Test, Integration, Build, Migrate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gr_ci_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gr_ci_db?schema=public"
      JWT_SECRET: "ci-test-jwt-secret-key-12345"
      PORT: 3000
      NODE_ENV: test
      OPENPAY_MERCHANT_ID: "ci_test_merchant_id"
      OPENPAY_PRIVATE_KEY: "sk_test_ci_dummy_key_12345"
      OPENPAY_PUBLIC_KEY: "pk_test_ci_dummy_key_12345"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Integration Tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Deploy Prisma Migrations (Clean DB Validation)
        run: npx prisma migrate deploy

  frontend-ci:
    name: Frontend CI (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
